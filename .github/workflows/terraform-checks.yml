name: Foundation checks

on:
  pull_request:
    paths:
      - "infra/**"
      - "api/**"
      - "web/**"
      - "pyproject.toml"
      - ".github/workflows/terraform-checks.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "api/**"
      - "web/**"
      - "pyproject.toml"
      - ".github/workflows/terraform-checks.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Run API tests
        working-directory: api
        run: python -m pytest tests

  web-build:
    name: PWA build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build PWA
        working-directory: web
        run: npm run build

  terraform:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize and validate configurations
        shell: bash
        run: |
          set -euo pipefail
          for directory in infra/bootstrap-state infra/bootstrap-iam infra; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done
