name: Review and deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan for review, apply a reviewed plan, or verify the live API
        type: choice
        options:
          - plan
          - apply
          - verify
        default: plan
        required: true
      target:
        description: Bootstrap Terraform IAM, deploy only the API, or deploy the API and web app
        type: choice
        options:
          - bootstrap-iam
          - api
          - all
        default: api
        required: true
      reviewed_plan_run_id:
        description: Required for apply; the workflow run ID of the reviewed plan
        type: string
        required: false
      confirm_destructive:
        description: Confirm only after reviewing exact destructive actions and recovery
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: garmin-trainer-deploy
  cancel-in-progress: false

jobs:
  review-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      ALLOWED_USER_EMAIL: ${{ secrets.ALLOWED_USER_EMAIL }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west1' }}
      TF_VAR_github_deploy_branch: main
      TF_VAR_wif_pool_id: github-actions
      TF_VAR_wif_provider_id: github
      TF_VAR_terraform_service_account_id: github-terraform
      TF_VAR_allowed_user_email: ${{ secrets.ALLOWED_USER_EMAIL }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_monthly_budget_usd: ${{ vars.GCP_MONTHLY_BUDGET_AMOUNT || vars.GCP_MONTHLY_BUDGET_USD || '6' }}
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_TARGET: ${{ inputs.target }}
      REVIEWED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
      CONFIRM_DESTRUCTIVE: ${{ inputs.confirm_destructive }}
      GAR_REPOSITORY: garmin-trainer
      CLOUD_RUN_SERVICE: garmin-trainer-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set GitHub variable GCP_PROJECT_ID}"
          : "${GCP_REGION:?Set GitHub variable GCP_REGION}"
          : "${GCP_WIF_PROVIDER:?Set GitHub variable GCP_WIF_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set GitHub variable GCP_TERRAFORM_SERVICE_ACCOUNT}"
          : "${GCP_BILLING_ACCOUNT_ID:?Set GitHub variable GCP_BILLING_ACCOUNT_ID}"
          : "${ALLOWED_USER_EMAIL:?Set GitHub secret ALLOWED_USER_EMAIL}"
          [[ "$DEPLOY_MODE" == "plan" || "$DEPLOY_MODE" == "apply" || "$DEPLOY_MODE" == "verify" ]] || { echo "::error::Invalid mode."; exit 1; }
          [[ "$DEPLOY_TARGET" == "bootstrap-iam" || "$DEPLOY_TARGET" == "api" || "$DEPLOY_TARGET" == "all" ]] || { echo "::error::Invalid target."; exit 1; }
          if [[ "$DEPLOY_MODE" == "apply" ]]; then
            [[ "$REVIEWED_PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Apply requires a numeric reviewed_plan_run_id."; exit 1; }
          fi
          if [[ "$DEPLOY_MODE" == "verify" && "$DEPLOY_TARGET" != "api" ]]; then
            echo "::error::Verify mode is available for the API target only."
            exit 1
          fi

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Terraform
        if: env.DEPLOY_MODE != 'verify'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Generate Terraform backend configuration
        if: env.DEPLOY_MODE != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_OWNER="${GITHUB_REPOSITORY%%/*}"
          GITHUB_REPO="${GITHUB_REPOSITORY#*/}"
          echo "TF_VAR_github_owner=${GITHUB_OWNER}" >> "$GITHUB_ENV"
          echo "TF_VAR_github_repo=${GITHUB_REPO}" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_IAM_PLAN=${RUNNER_TEMP}/bootstrap-iam.tfplan" >> "$GITHUB_ENV"
          echo "INFRA_PLAN=${RUNNER_TEMP}/infra.tfplan" >> "$GITHUB_ENV"
          echo "INFRA_SHA256=not-applicable" >> "$GITHUB_ENV"
          cat > infra/backend.hcl <<EOF
          bucket = "${GCP_PROJECT_ID}-tfstate"
          prefix = "garmin-trainer"
          EOF
          cat > infra/bootstrap-iam/backend.hcl <<EOF
          bucket = "${GCP_PROJECT_ID}-tfstate"
          prefix = "garmin-trainer/bootstrap-iam"
          EOF

      - name: Load reviewed plan manifest
        if: env.DEPLOY_MODE == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-tfstate"
          manifest="$RUNNER_TEMP/reviewed-plan.json"
          plan_prefix="gs://${bucket}/garmin-trainer/release-plans/${REVIEWED_PLAN_RUN_ID}"
          object="${plan_prefix}/manifest.json"
          if ! gcloud storage cp --quiet "$object" "$manifest" >"$RUNNER_TEMP/manifest-download.log" 2>&1; then
            echo "::error::Reviewed plan manifest could not be loaded from the private state bucket."
            exit 1
          fi
          if ! jq -e \
            --arg run_id "$REVIEWED_PLAN_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg target "$DEPLOY_TARGET" \
            '.schema_version == 2 and
             .plan_run_id == $run_id and
             .commit == $commit and
             .target == $target and
             (.created_at_epoch | type == "number") and
             (.bootstrap_iam_sha256 | test("^[a-f0-9]{64}$")) and
             (if $target == "bootstrap-iam" then .infra_sha256 == "not-applicable"
              else (.infra_sha256 | test("^[a-f0-9]{64}$")) end)' \
            "$manifest" >/dev/null 2>&1; then
            echo "::error::Reviewed plan is missing, stale, or does not match this commit and target."
            exit 1
          fi
          created_at_epoch="$(jq -r '.created_at_epoch' "$manifest")"
          now_epoch="$(date -u +%s)"
          age_seconds=$((now_epoch - created_at_epoch))
          if (( age_seconds < 0 || age_seconds > 86400 )); then
            echo "::error::Reviewed Terraform plans have expired; create a new plan run."
            exit 1
          fi
          echo "REVIEWED_BOOTSTRAP_IAM_SHA256=$(jq -r '.bootstrap_iam_sha256' "$manifest")" >> "$GITHUB_ENV"
          echo "REVIEWED_INFRA_SHA256=$(jq -r '.infra_sha256' "$manifest")" >> "$GITHUB_ENV"
          if ! gcloud storage cp --quiet "${plan_prefix}/bootstrap-iam.tfplan" "$BOOTSTRAP_IAM_PLAN" >"$RUNNER_TEMP/bootstrap-plan-download.log" 2>&1; then
            echo "::error::Reviewed bootstrap IAM plan file could not be downloaded."
            exit 1
          fi
          if [[ "$DEPLOY_TARGET" != "bootstrap-iam" ]]; then
            if ! gcloud storage cp --quiet "${plan_prefix}/infra.tfplan" "$INFRA_PLAN" >"$RUNNER_TEMP/infra-plan-download.log" 2>&1; then
              echo "::error::Reviewed infrastructure plan file could not be downloaded."
              exit 1
            fi
          fi

      - name: Terraform format and validate
        if: env.DEPLOY_MODE != 'verify'
        run: terraform fmt -check -recursive infra

      - name: Initialize and validate Terraform roots
        if: env.DEPLOY_MODE != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/bootstrap-iam init -input=false -backend-config=backend.hcl
          terraform -chdir=infra/bootstrap-iam validate
          terraform -chdir=infra init -input=false -backend-config=backend.hcl
          terraform -chdir=infra validate

      - name: Plan bootstrap IAM
        if: env.DEPLOY_MODE == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=infra/bootstrap-iam plan -input=false -no-color -detailed-exitcode -out="$BOOTSTRAP_IAM_PLAN" >"$RUNNER_TEMP/bootstrap-iam-plan.log" 2>&1
          plan_status=$?
          set -e
          if [[ "$plan_status" -ne 0 && "$plan_status" -ne 2 ]]; then
            summary="$(grep -m 1 'Error:' "$RUNNER_TEMP/bootstrap-iam-plan.log" | sed -E 's/^.*(Error:)/\1/; s/[[:alnum:]._%+-]+@[[:alnum:].-]+/[redacted-email]/g' || true)"
            if [[ -n "$summary" ]]; then
              echo "::error::Terraform bootstrap IAM planning failed: $summary"
            else
              echo "::error::Terraform bootstrap IAM planning failed; sensitive plan output was suppressed."
            fi
            exit 1
          fi
          fingerprint="$(sha256sum "$BOOTSTRAP_IAM_PLAN" | cut -d' ' -f1)"
          echo "BOOTSTRAP_IAM_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Plan infrastructure
        if: env.DEPLOY_MODE == 'plan' && env.DEPLOY_TARGET != 'bootstrap-iam'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=infra plan -input=false -no-color -detailed-exitcode -out="$INFRA_PLAN" >"$RUNNER_TEMP/infra-plan.log" 2>&1
          plan_status=$?
          set -e
          if [[ "$plan_status" -ne 0 && "$plan_status" -ne 2 ]]; then
            summary="$(grep -m 1 'Error:' "$RUNNER_TEMP/infra-plan.log" | sed -E 's/^.*(Error:)/\1/; s/[[:alnum:]._%+-]+@[[:alnum:].-]+/[redacted-email]/g' || true)"
            if [[ -n "$summary" ]]; then
              echo "::error::Terraform infrastructure planning failed: $summary"
            else
              echo "::error::Terraform infrastructure planning failed; sensitive plan output was suppressed."
            fi
            exit 1
          fi
          fingerprint="$(sha256sum "$INFRA_PLAN" | cut -d' ' -f1)"
          echo "INFRA_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Publish sanitized resource-action summary
        if: env.DEPLOY_MODE == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          summarize_plan() {
            local label="$1"
            local root="$2"
            local plan_file="$3"
            local json_file="$4"
            local error_file="$5"
            if ! terraform -chdir="$root" show -json "$plan_file" >"$json_file" 2>"$error_file"; then
              echo "::error::Terraform plan summary could not be generated."
              exit 1
            fi
            printf '### %s\n' "$label" | tee -a "$GITHUB_STEP_SUMMARY"
            local changes
            changes="$(jq -r '
              [.resource_changes[]?
               | select((.change.actions != ["no-op"] and .change.actions != ["read"])
                       or (.change.importing? != null))
               | (if .change.importing? != null then "import"
                  else (.change.actions | join("/")) end) + " \(.address)"]
              | if length == 0 then "No resource changes" else .[] end
            ' "$json_file")"
            while IFS= read -r change; do
              printf -- '- `%s`\n' "$change" | tee -a "$GITHUB_STEP_SUMMARY"
            done <<< "$changes"
          }
          summarize_plan "Bootstrap IAM resource actions" "infra/bootstrap-iam" "$BOOTSTRAP_IAM_PLAN" "$RUNNER_TEMP/bootstrap-iam-plan.json" "$RUNNER_TEMP/bootstrap-iam-show.log"
          if [[ "$DEPLOY_TARGET" != "bootstrap-iam" ]]; then
            summarize_plan "Infrastructure resource actions" "infra" "$INFRA_PLAN" "$RUNNER_TEMP/infra-plan.json" "$RUNNER_TEMP/infra-show.log"
          fi
          {
            printf '\nPlan run ID: `%s`\n' "$GITHUB_RUN_ID"
            printf 'Target: `%s`\n' "$DEPLOY_TARGET"
            printf 'No resources were applied. To continue, dispatch apply on this same commit and target, using this plan run ID.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store private reviewed Terraform plans
        if: env.DEPLOY_MODE == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-tfstate"
          if ! access_prevention="$(gcloud storage buckets describe "gs://${bucket}" --format='value(public_access_prevention)' 2>"$RUNNER_TEMP/bucket-describe.log")"; then
            echo "::error::Could not verify the Terraform state bucket access policy."
            exit 1
          fi
          [[ "$access_prevention" == "enforced" ]] || { echo "::error::Terraform state bucket public access prevention is '$access_prevention', not enforced."; exit 1; }
          plan_prefix="gs://${bucket}/garmin-trainer/release-plans/${GITHUB_RUN_ID}"
          if ! gcloud storage cp --quiet --if-generation-match=0 "$BOOTSTRAP_IAM_PLAN" "${plan_prefix}/bootstrap-iam.tfplan" >"$RUNNER_TEMP/bootstrap-plan-upload.log" 2>&1; then
            echo "::error::Bootstrap IAM plan could not be stored in the private state bucket; no apply was run."
            exit 1
          fi
          if [[ "$DEPLOY_TARGET" != "bootstrap-iam" ]]; then
            if ! gcloud storage cp --quiet --if-generation-match=0 "$INFRA_PLAN" "${plan_prefix}/infra.tfplan" >"$RUNNER_TEMP/infra-plan-upload.log" 2>&1; then
              echo "::error::Infrastructure plan could not be stored in the private state bucket; no apply was run."
              exit 1
            fi
          fi
          manifest="$RUNNER_TEMP/plan-manifest.json"
          created_at_epoch="$(date -u +%s)"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg target "$DEPLOY_TARGET" \
            --argjson created_at_epoch "$created_at_epoch" \
            --arg bootstrap_iam_sha256 "$BOOTSTRAP_IAM_SHA256" \
            --arg infra_sha256 "$INFRA_SHA256" \
            '{schema_version: 2, plan_run_id: $run_id, commit: $commit, target: $target, created_at_epoch: $created_at_epoch, bootstrap_iam_sha256: $bootstrap_iam_sha256, infra_sha256: $infra_sha256}' \
            > "$manifest"
          object="${plan_prefix}/manifest.json"
          if ! gcloud storage cp --quiet --if-generation-match=0 "$manifest" "$object" >"$RUNNER_TEMP/manifest-upload.log" 2>&1; then
            echo "::error::Private plan manifest could not be stored; no apply was run. Start a new plan run if this run ID was already used."
            exit 1
          fi

      - name: Verify reviewed plan files
        if: env.DEPLOY_MODE == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_sha256="$(sha256sum "$BOOTSTRAP_IAM_PLAN" | cut -d' ' -f1)"
          if [[ "$bootstrap_sha256" != "$REVIEWED_BOOTSTRAP_IAM_SHA256" ]]; then
            echo "::error::Downloaded bootstrap IAM plan checksum does not match the reviewed plan; no Terraform plan was applied."
            exit 1
          fi
          if [[ "$DEPLOY_TARGET" != "bootstrap-iam" ]]; then
            infra_sha256="$(sha256sum "$INFRA_PLAN" | cut -d' ' -f1)"
            if [[ "$infra_sha256" != "$REVIEWED_INFRA_SHA256" ]]; then
              echo "::error::Downloaded infrastructure plan checksum does not match the reviewed plan; no Terraform plan was applied."
              exit 1
            fi
          fi

      - name: Require destructive-change review
        if: env.DEPLOY_MODE == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          plans=("infra/bootstrap-iam:$BOOTSTRAP_IAM_PLAN:bootstrap-iam")
          if [[ "$DEPLOY_TARGET" != "bootstrap-iam" ]]; then
            plans+=("infra:$INFRA_PLAN:infra")
          fi
          for entry in "${plans[@]}"; do
            IFS=: read -r root plan name <<< "$entry"
            json_file="$RUNNER_TEMP/${name}-apply-plan.json"
            if ! terraform -chdir="$root" show -json "$plan" >"$json_file" 2>"$RUNNER_TEMP/${name}-apply-show.log"; then
              echo "::error::Terraform plan could not be checked for destructive actions."
              exit 1
            fi
            has_deletes="$(jq -r '[.resource_changes[]? | select(any(.change.actions[]?; . == "delete"))] | length > 0' "$json_file")"
            if [[ "$has_deletes" == "true" ]]; then
              if [[ "$CONFIRM_DESTRUCTIVE" != "true" ]]; then
                echo "::error::A reviewed plan includes a destructive action. Inspect the exact actions and recovery path, then re-dispatch apply with confirm_destructive enabled."
                exit 1
              fi
            fi
          done

      - name: Apply bootstrap IAM plan
        if: env.DEPLOY_MODE == 'apply'
        id: apply_bootstrap_iam
        shell: bash
        run: |
          set -euo pipefail
          if ! terraform -chdir=infra/bootstrap-iam apply -input=false "$BOOTSTRAP_IAM_PLAN" >"$RUNNER_TEMP/bootstrap-iam-apply.log" 2>&1; then
            summary="$(grep -m 1 'Error:' "$RUNNER_TEMP/bootstrap-iam-apply.log" | sed -E 's/^.*(Error:)/\1/; s/[[:alnum:]._%+-]+@[[:alnum:].-]+/[redacted-email]/g' || true)"
            if [[ -n "$summary" ]]; then
              echo "::error::Bootstrap IAM apply failed: $summary"
            else
              echo "::error::Bootstrap IAM apply failed; Terraform output was suppressed."
            fi
            exit 1
          fi

      - name: Apply infrastructure plan
        if: env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET != 'bootstrap-iam'
        id: apply_infrastructure
        shell: bash
        run: |
          set -euo pipefail
          if ! terraform -chdir=infra apply -input=false "$INFRA_PLAN" >"$RUNNER_TEMP/infra-apply.log" 2>&1; then
            summary="$(grep -m 1 'Error:' "$RUNNER_TEMP/infra-apply.log" | sed -E 's/^.*(Error:)/\1/; s/[[:alnum:]._%+-]+@[[:alnum:].-]+/[redacted-email]/g' || true)"
            if [[ -n "$summary" ]]; then
              echo "::error::Infrastructure apply failed: $summary"
            else
              echo "::error::Infrastructure apply failed; Terraform output was suppressed."
            fi
            exit 1
          fi

      - name: Export public Firebase client config
        if: env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET == 'all'
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$(terraform -chdir=infra output -json firebase_web_app_config)"
          echo "VITE_FIREBASE_API_KEY=$(jq -r '.api_key' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=$(jq -r '.auth_domain' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=$(jq -r '.project_id' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_APP_ID=$(jq -r '.app_id' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_API_BASE_URL=/api" >> "$GITHUB_ENV"

      - name: Build and push API image
        if: env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET != 'bootstrap-iam'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/garmin-trainer-api:${GITHUB_SHA}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" ./api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API image
        if: env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET != 'bootstrap-iam'
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --quiet >"$RUNNER_TEMP/cloud-run-update.log" 2>&1; then
            echo "::error::Cloud Run API image update failed; command output was suppressed."
            exit 1
          fi
          echo "Cloud Run API image updated."

      - name: Verify public Cloud Run access and API authorization
        if: env.DEPLOY_MODE == 'verify' || (env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET != 'bootstrap-iam')
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/cloud-run-iam-policy.json"
          if ! gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json >"$policy" 2>"$RUNNER_TEMP/cloud-run-iam-policy.log"; then
            echo "::error::Cloud Run invoker policy could not be verified."
            exit 1
          fi
          if ! jq -e 'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == "allUsers"))' "$policy" >/dev/null; then
            echo "::error::Cloud Run does not grant allUsers the run.invoker role."
            exit 1
          fi

          if ! api_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' 2>"$RUNNER_TEMP/cloud-run-describe.log")"; then
            echo "::error::Cloud Run service URL could not be read."
            exit 1
          fi
          printf 'Cloud Run URL: `%s`\n' "$api_url" | tee -a "$GITHUB_STEP_SUMMARY"
          health_status="000"
          health_ok=false
          for attempt in {1..10}; do
            if ! health_status="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' --max-time 10 "$api_url/health" 2>"$RUNNER_TEMP/health-curl.log")"; then
              health_status="000"
            fi
            if [[ "$health_status" == "200" ]]; then
              if jq -e '.status == "ok"' "$RUNNER_TEMP/health.json" >/dev/null; then
                health_ok=true
              fi
              break
            fi
            if [[ "$health_status" != "000" && "$health_status" != "404" && "$health_status" != 5?? ]]; then
              break
            fi
            sleep 5
          done
          if ! identity_status="$(curl --silent --show-error --output "$RUNNER_TEMP/me.json" --write-out '%{http_code}' --max-time 10 "$api_url/api/v1/me" 2>"$RUNNER_TEMP/me-curl.log")"; then
            identity_status="000"
          fi
          openapi_status="000"
          openapi_paths="unavailable"
          if openapi_status="$(curl --silent --show-error --output "$RUNNER_TEMP/openapi.json" --write-out '%{http_code}' --max-time 10 "$api_url/openapi.json" 2>"$RUNNER_TEMP/openapi-curl.log")" && [[ "$openapi_status" == "200" ]]; then
            openapi_paths="$(jq -r '.paths | keys | join(", ")' "$RUNNER_TEMP/openapi.json" 2>/dev/null || echo "invalid schema")"
          fi
          printf 'Observed endpoints: `/health` HTTP %s; `/api/v1/me` HTTP %s; `/openapi.json` HTTP %s; paths: %s\n' \
            "$health_status" "$identity_status" "$openapi_status" "$openapi_paths" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$health_ok" != "true" || "$identity_status" != "401" ]]; then
            echo "::error::Unauthenticated checks returned /health HTTP ${health_status} (expected 200/status ok) and /api/v1/me HTTP ${identity_status} (expected 401)."
            exit 1
          fi
          echo "Verified allUsers invoker, public /health (200), and protected /api/v1/me (401)."

      - name: Set up Node.js
        if: env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET == 'all'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and deploy PWA and Firestore rules
        if: env.DEPLOY_MODE == 'apply' && env.DEPLOY_TARGET == 'all'
        working-directory: web
        run: |
          npm ci
          npm run build
          npx firebase deploy --only hosting,firestore:rules --project "$GCP_PROJECT_ID" --non-interactive

      - name: Remove applied Terraform plan objects
        if: ${{ always() && env.DEPLOY_MODE == 'apply' && steps.apply_bootstrap_iam.outcome == 'success' && (env.DEPLOY_TARGET == 'bootstrap-iam' || steps.apply_infrastructure.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-tfstate"
          plan_prefix="gs://${bucket}/garmin-trainer/release-plans/${REVIEWED_PLAN_RUN_ID}"
          objects=("${plan_prefix}/bootstrap-iam.tfplan" "${plan_prefix}/manifest.json")
          if [[ "$DEPLOY_TARGET" != "bootstrap-iam" ]]; then
            objects+=("${plan_prefix}/infra.tfplan")
          fi
          if ! gcloud storage rm --quiet --all-versions "${objects[@]}" >"$RUNNER_TEMP/plan-cleanup.log" 2>&1; then
            echo "::warning::Applied plan objects could not be fully removed; they remain private in the state bucket."
          fi
