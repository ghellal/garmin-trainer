name: Apply infrastructure and deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      ALLOWED_USER_EMAIL: ${{ secrets.ALLOWED_USER_EMAIL }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west1' }}
      TF_VAR_github_deploy_branch: main
      TF_VAR_wif_pool_id: github-actions
      TF_VAR_wif_provider_id: github
      TF_VAR_terraform_service_account_id: github-terraform
      TF_VAR_allowed_user_email: ${{ secrets.ALLOWED_USER_EMAIL }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_monthly_budget_usd: ${{ vars.GCP_MONTHLY_BUDGET_USD || '6' }}
      GAR_REPOSITORY: garmin-trainer
      CLOUD_RUN_SERVICE: garmin-trainer-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set GitHub variable GCP_PROJECT_ID}"
          : "${GCP_REGION:?Set GitHub variable GCP_REGION}"
          : "${GCP_WIF_PROVIDER:?Set GitHub variable GCP_WIF_PROVIDER}"
          : "${GCP_TERRAFORM_SERVICE_ACCOUNT:?Set GitHub variable GCP_TERRAFORM_SERVICE_ACCOUNT}"
          : "${GCP_BILLING_ACCOUNT_ID:?Set GitHub variable GCP_BILLING_ACCOUNT_ID}"
          : "${ALLOWED_USER_EMAIL:?Set GitHub secret ALLOWED_USER_EMAIL}"

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Generate Terraform backend configuration
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_OWNER="${GITHUB_REPOSITORY%%/*}"
          GITHUB_REPO="${GITHUB_REPOSITORY#*/}"
          echo "TF_VAR_github_owner=${GITHUB_OWNER}" >> "$GITHUB_ENV"
          echo "TF_VAR_github_repo=${GITHUB_REPO}" >> "$GITHUB_ENV"
          cat > infra/backend.hcl <<EOF
          bucket = "${GCP_PROJECT_ID}-tfstate"
          prefix = "garmin-trainer"
          EOF

      - name: Terraform format and validate
        run: terraform fmt -check -recursive infra

      - name: Plan and apply Terraform
        working-directory: infra
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform validate
          terraform plan -input=false -out=deployment.tfplan
          terraform apply -input=false deployment.tfplan

      - name: Export public Firebase client config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$(terraform -chdir=infra output -json firebase_web_app_config)"
          echo "VITE_FIREBASE_API_KEY=$(jq -r '.api_key' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=$(jq -r '.auth_domain' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=$(jq -r '.project_id' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_APP_ID=$(jq -r '.app_id' <<< "$CONFIG")" >> "$GITHUB_ENV"
          echo "VITE_API_BASE_URL=/api" >> "$GITHUB_ENV"

      - name: Build and push API image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/garmin-trainer-api:${GITHUB_SHA}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" ./api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API image
        run: >-
          gcloud run services update "$CLOUD_RUN_SERVICE"
          --project="$GCP_PROJECT_ID"
          --region="$GCP_REGION"
          --image="$IMAGE"
          --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and deploy PWA and Firestore rules
        working-directory: web
        run: |
          npm ci
          npm run build
          npx firebase deploy --only hosting,firestore:rules --project "$GCP_PROJECT_ID" --non-interactive
