[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-training-agents"
version = "0.1.0"
description = "AI coaching agents that read your Garmin SQLite database"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "claude-agent-sdk>=0.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=25.0",
]

[project.scripts]
training-coach = "agents.training_coach:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
